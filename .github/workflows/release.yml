name: Release

# main 上 plugin.json 的 version 变化后，如果还没有对应的 vX.Y.Z 标签，就自动打标签并发布 Release（说明取自 CHANGELOG 对应段落）。
# 发版流程：改版本号（三处）+ CHANGELOG → PR → CI 通过合并 → 本工作流自动发布。
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: echo "version=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Check tag
        id: t
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v${{ steps.v.outputs.version }} already released, skipping"
          fi
      - name: Repo self-check
        if: steps.t.outputs.exists != 'true'
        run: python3 tools/check_repo.py
      - name: Release notes from CHANGELOG
        if: steps.t.outputs.exists != 'true'
        run: python3 tools/changelog_section.py "${{ steps.v.outputs.version }}" > notes.md && cat notes.md
      - name: Create release
        if: steps.t.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="v${{ steps.v.outputs.version }} — $(head -1 notes.md | sed -E 's/\[([^]]*)\]\([^)]*\)/\1/g' | cut -c1-70)"   # 标题里的 markdown 链接只保留文字
          gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
